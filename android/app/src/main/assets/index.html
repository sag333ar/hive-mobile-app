<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hive Mobile App</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script src="https://unpkg.com/@hiveio/dhive@latest/dist/dhive.js"></script>
  <script>
    var client = new dhive.Client([
      "https://api.hive.blog",
      "https://api.deathwings.me",
      "https://hive-api.arcange.eu",
      "https://hived.emre.sh",
      "https://api.openhive.network",
      "https://rpc.ausbit.dev",
      "https://rpc.mahdiyari.info",
      "https://hive-api.3speak.tv",
      "https://anyx.io",
      "https://techcoderx.com",
      "https://api.hive.blue",
      "https://api.c0ff33a.uk",
      "https://api.pharesim.me",
      "https://hived.privex.io",
      "https://hive.roelandp.nl",
    ]);

    async function getChainProps(identifier) {
      const props = await client.database.getChainProperties();
      replyToNative({
        id: identifier,
        type: "getChainProps",
        data: props,
        valid: true,
        error: "",
      });
    }

    async function getFeed(identifier, type) {
      var response = await client.database.getDiscussions(type);
      replyToNative({
        id: identifier,
        type: "getFeed",
        data: response,
        valid: true,
        error: "",
      });
    }


    async function getListOfCommunities(identifier, limit, lastName) {
      const response = await client.hivemind.listCommunities(
        { sort: "rank", last: lastName, limit: limit, }
      );
      replyToNative({
        id: identifier,
        type: "getListOfCommunities",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getWitnesses(identifier, limit, lastName) {
      const response = await client.database.call("get_witnesses_by_vote", [lastName, limit]);
      replyToNative({
        id: identifier,
        type: "getWitnesses",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getProposals(identifier, limit) {
      const response = await client.database.call("list_proposals", [[-1], limit, "by_total_votes", "descending", "votable"]);
      replyToNative({
        id: identifier,
        type: "getProposals",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getFollowCount(identifier, accountName) {
      const response = await client.database.call("get_follow_count", [accountName]);
      replyToNative({
        id: identifier,
        type: "getFollowCount",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getAccountInfo(identifier, accountName) {
      const response = await client.database.call("get_accounts", [[accountName]]);
      replyToNative({
        id: identifier,
        type: "getAccountInfo",
        data: response[0],
        valid: true,
        error: "",
      });
    }

    async function getFollowing(identifier, accountName, lastName, limit) {
      const response = await client.database.call("get_following", [accountName, lastName, "blog", limit]);
      replyToNative({
        id: identifier,
        type: "getFollowing",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getFollowers(identifier, accountName, lastName, limit) {
      const response = await client.database.call("get_followers", [accountName, lastName, "blog", limit]);
      replyToNative({
        id: identifier,
        type: "getFollowers",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getAccountPosts(identifier, accountName, type, lastAuthor, lastPermlink, limit) {
      const response = await client.hivemind.getAccountPosts({ account: accountName, sort: type, start_author: lastAuthor, start_permlink: lastPermlink, limit: limit });
      replyToNative({
        id: identifier,
        type: "getAccountPosts",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getCommunityDetails(identifier, communityId) {
      const response = await client.hivemind.getCommunity({ "name": communityId });
      replyToNative({
        id: identifier,
        type: "getCommunityDetails",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getCommunityFeed(identifier, communityId, type, lastAuthor, lastPermlink, limit) {
      const response = await client.hivemind.getRankedPosts({ tag: communityId, sort: type, start_author: lastAuthor, start_permlink: lastPermlink, limit: limit });
      replyToNative({
        id: identifier,
        type: "getCommunityFeed",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getCommunitySubscribers(identifier, communityId, limit, lastName) {
      const response = await client.hivemind.call('list_subscribers', { community: communityId, limit: limit, last: lastName });
      replyToNative({
        id: identifier,
        type: "getCommunitySubscribers",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getSubscribedCommunities(identifier, accountName) {
      const response = await client.hivemind.listAllSubscriptions([accountName]);
      replyToNative({
        id: identifier,
        type: "getSubscribedCommunities",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getGlobalChainProperties(identifier,) {
      const response = await client.database.getDynamicGlobalProperties();
      replyToNative({
        id: identifier,
        type: "getGlobalChainProperties",
        data: response,
        valid: true,
        error: "",
      });
    }

    async function getAccountHistory(identifier, accountName, startId, limit) {
      const response = await client.database.getAccountHistory(accountName, startId, limit,)
      replyToNative({
        id: identifier,
        type: "getAccountHistory",
        data: response,
        valid: true,
        error: "",
      });
    }

    function replyToNative(result) {
      Android.postMessage(JSON.stringify(result));
    }
  </script>
</body>

</html>
